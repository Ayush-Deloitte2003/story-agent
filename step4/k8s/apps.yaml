apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: flight-api }
  template:
    metadata:
      labels: { app: flight-api }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "flight-api"
        dapr.io/app-port: "8000"
    spec:
      containers:
        - name: api
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: DATABASE_URL, value: "postgresql://flights:local-kind-only@step4-postgres:5432/flights" }
            - { name: ENABLE_FAILURE_INJECTION, value: "true" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flight-api
spec:
  selector: { app: flight-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-worker
spec:
  replicas: 2
  selector:
    matchLabels: { app: booking-worker }
  template:
    metadata:
      labels: { app: booking-worker }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "booking-worker"
        dapr.io/app-port: "8000"
    spec:
      containers:
        - name: worker
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.booking_worker:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: DATABASE_URL, value: "postgresql://flights:local-kind-only@step4-postgres:5432/flights" }
            - { name: BOOKING_ADVISOR_URL, value: "http://127.0.0.1:8101/advise" }
            - { name: PAYMENT_ADVISOR_URL, value: "http://127.0.0.1:8102/assess" }
            - { name: FARE_ADVISOR_URL, value: "http://127.0.0.1:8104/compare" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
        - name: booking-advisor
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.booking_advisor:app", "--host", "127.0.0.1", "--port", "8101"]
          env:
            - { name: AGENT_MODE, value: "mock" }
            - { name: OPENAI_MODEL, value: "gpt-4o-mini" }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: step4-llm
                  key: OPENAI_API_KEY
                  optional: true
          ports: [{ containerPort: 8101 }]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz', timeout=2)"
            periodSeconds: 5
        - name: payment-advisor
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.payment_advisor:app", "--host", "127.0.0.1", "--port", "8102"]
          env:
            - { name: AGENT_MODE, value: "mock" }
            - { name: OPENAI_MODEL, value: "gpt-4o-mini" }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: step4-llm
                  key: OPENAI_API_KEY
                  optional: true
          ports: [{ containerPort: 8102 }]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/healthz', timeout=2)"
            periodSeconds: 5
        - name: fare-advisor
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.fare_advisor:app", "--host", "127.0.0.1", "--port", "8104"]
          env:
            - { name: AGENT_MODE, value: "mock" }
            - { name: OPENAI_MODEL, value: "gpt-4o-mini" }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: step4-llm
                  key: OPENAI_API_KEY
                  optional: true
          ports: [{ containerPort: 8104 }]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/healthz', timeout=2)"
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booking-worker
spec:
  selector: { app: booking-worker }
  ports: [{ port: 80, targetPort: 8000 }]
---
