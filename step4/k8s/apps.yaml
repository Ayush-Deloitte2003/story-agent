# Read-only support service: no Dapr, no workflow and no writes, so a slow advisor call cannot affect bookings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: support-service }
  template:
    metadata:
      labels: { app: support-service }
    spec:
      containers:
        - name: service
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.support_service:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - { name: DATABASE_URL, value: "postgresql://flights:local-kind-only@step4-postgres:5432/flights" }
            - { name: SUPPORT_ADVISOR_URL, value: "http://127.0.0.1:8105/answer" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
        - name: support-advisor
          image: flight-booking:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.support_advisor:app", "--host", "127.0.0.1", "--port", "8105"]
          env:
            - { name: AGENT_MODE, value: "mock" }
            - { name: OPENAI_MODEL, value: "gpt-4o-mini" }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: step4-llm
                  key: OPENAI_API_KEY
                  optional: true
          ports: [{ containerPort: 8105 }]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/healthz', timeout=2)"
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: support-service
spec:
  selector: { app: support-service }
  ports: [{ port: 8000, targetPort: 8000 }]
