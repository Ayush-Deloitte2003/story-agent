name: step3-kind

# Runs Step 3 on a Kind cluster (Dapr in Kubernetes mode, Redis state store) in GitHub Actions,
# because the developer laptop cannot run Docker/Podman. Manual trigger only: it calls OpenAI.
# Needs the repository secret OPENAI_API_KEY.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLUSTER: story
  DAPR_CLI_VERSION: 1.18.2
  DAPR_RUNTIME_VERSION: 1.19.0
  VERIFY_REPORT_PREFIX: kind

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: step3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deterministic publisher and workflow unit tests
        run: python -m unittest discover -s tests -v

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.CLUSTER }}

      - name: Install Dapr in the cluster
        run: |
          wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash -s "$DAPR_CLI_VERSION"
          dapr init -k --runtime-version "$DAPR_RUNTIME_VERSION" --wait --timeout 600
          kubectl get pods -n dapr-system
          dapr status -k

      - name: Build and load the image
        run: |
          docker build -t story-agent:dev .
          kind load docker-image story-agent:dev --name "$CLUSTER"

      - name: Create secret and deploy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Repository secret OPENAI_API_KEY is not set"; exit 1; }
          kubectl create secret generic story-agent-env --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
          kubectl apply -f k8s/redis.yaml -f k8s/statestore.yaml -f k8s/pubsub.yaml -f k8s/resiliency.yaml -f k8s/publisher.yaml -f k8s/story-agent.yaml
          for d in redis publisher story-agent; do kubectl rollout status "deployment/$d" --timeout=300s; done
          kubectl get pods

      - name: Verify (retries, expiry, 410)
        run: |
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          app_pod=$(kubectl get pod -l app=story-agent -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward "$app_pod" 3500:3500 >/tmp/dapr-pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py run
          python scripts/verify_event_intake.py

      - name: Quality-review concurrency baseline (10 workflows)
        run: python scripts/verify_quality_review_load.py

      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser-test.txt
          python -m playwright install --with-deps chromium

      - name: Browser-driven reviewer journey
        run: python scripts/verify_browser_review.py

      - name: Concurrent approval decision race
        run: python scripts/verify_step3.py race

      - name: Cross-replica approval decision coordination
        run: |
          set -euo pipefail
          trap 'kubectl scale deployment/story-agent --replicas=1 >/dev/null 2>&1 || true; pkill -f "kubectl port-forward" || true' EXIT
          pkill -f "kubectl port-forward" || true
          kubectl scale deployment/story-agent --replicas=2
          kubectl rollout status deployment/story-agent --timeout=300s
          mapfile -t pods < <(kubectl get pods -l app=story-agent -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          test "${#pods[@]}" -eq 2
          kubectl port-forward "pod/${pods[0]}" 8001:8000 >/tmp/pf-1.log 2>&1 &
          kubectl port-forward "pod/${pods[1]}" 8002:8000 >/tmp/pf-2.log 2>&1 &
          sleep 5
          APP_URLS=http://127.0.0.1:8001,http://127.0.0.1:8002 python scripts/verify_approval_multi_replica.py
          kubectl scale deployment/story-agent --replicas=1
          kubectl rollout status deployment/story-agent --timeout=300s
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          trap - EXIT

      - name: Restart test (delete the app pod)
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py start
          old=$(kubectl get pod -l app=story-agent -o name)
          kubectl delete "$old" --wait=false
          kubectl wait --for=delete "$old" --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=story-agent --timeout=300s
          kubectl get pods
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py resume

      - name: Quality-review recovery and same-ID replay
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_quality_review_recovery.py start
          old=$(kubectl get pod -l app=story-agent -o name)
          kubectl delete "$old" --wait=false
          kubectl wait --for=delete "$old" --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=story-agent --timeout=300s
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_quality_review_recovery.py resume

      - name: Continuity-check recovery after app replacement
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_specialist_recovery.py continuity-check start
          old=$(kubectl get pod -l app=story-agent -o name)
          kubectl delete "$old" --wait=false
          kubectl wait --for=delete "$old" --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=story-agent --timeout=300s
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_specialist_recovery.py continuity-check resume

      - name: Brief-compliance recovery after app replacement
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_specialist_recovery.py brief-compliance start
          old=$(kubectl get pod -l app=story-agent -o name)
          kubectl delete "$old" --wait=false
          kubectl wait --for=delete "$old" --timeout=180s
          kubectl wait --for=condition=Ready pod -l app=story-agent --timeout=300s
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_specialist_recovery.py brief-compliance resume

      - name: Publishing recovery across publisher and app replacement
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py publishing-start
          pkill -f "kubectl port-forward" || true
          found=false
          for attempt in {1..30}; do
            if kubectl exec deploy/publisher -- cat /data/attempts.json > verify_output_step3_kind_publisher_before.json 2>/dev/null &&
                python scripts/verify_publisher_state.py verify_output_step3_publishing-start_approved.json verify_output_step3_kind_publisher_before.json >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 1
          done
          test "$found" = true || { echo "Publisher did not record the first retry attempt"; exit 1; }
          kubectl scale deployment/story-agent --replicas=0
          kubectl wait --for=delete pod -l app=story-agent --timeout=180s
          python scripts/verify_publisher_state.py verify_output_step3_publishing-start_approved.json verify_output_step3_kind_publisher_before.json
          kubectl rollout restart deployment/publisher
          kubectl rollout status deployment/publisher --timeout=300s
          kubectl exec deploy/publisher -- cat /data/attempts.json > verify_output_step3_kind_publisher_after.json
          python scripts/verify_publisher_state.py verify_output_step3_publishing-start_approved.json verify_output_step3_kind_publisher_after.json --previous-state verify_output_step3_kind_publisher_before.json
          kubectl scale deployment/story-agent --replicas=1
          kubectl rollout status deployment/story-agent --timeout=300s
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py publishing-resume
          published_name=$(python -c 'import json,re; d=json.load(open("verify_output_step3_publishing-resume_approved.json", encoding="utf-8")); print(re.search(r"published/([^ ]+)", d["reply"]).group(1))')
          kubectl exec deploy/publisher -- cat "/data/published/$published_name" > verify_output_step3_kind_publishing-recovery.md
          kubectl exec deploy/publisher -- cat /data/attempts.json > verify_output_step3_kind_publisher_final.json
          python scripts/verify_publisher_state.py verify_output_step3_publishing-resume_approved.json verify_output_step3_kind_publisher_final.json --previous-state verify_output_step3_kind_publisher_before.json --published-markdown verify_output_step3_kind_publishing-recovery.md
          python scripts/verify_published_story.py verify_output_step3_publishing-resume_approved.json verify_output_step3_kind_publishing-recovery.md

      - name: Redis restart recovery
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py redis-start
          kubectl rollout restart deployment/redis
          kubectl rollout status deployment/redis --timeout=300s
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py redis-resume

      - name: Approval expiry during app downtime
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py expiry-start
          pkill -f "kubectl port-forward" || true
          kubectl scale deployment/story-agent --replicas=0
          kubectl wait --for=delete pod -l app=story-agent --timeout=180s
          sleep 15
          kubectl scale deployment/story-agent --replicas=1
          kubectl rollout status deployment/story-agent --timeout=300s
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py expiry-resume

      - name: Retry exhaustion
        run: |
          pkill -f "kubectl port-forward" || true
          kubectl set env deployment/story-agent PUBLISH_MAX_ATTEMPTS=2
          kubectl rollout status deployment/story-agent --timeout=300s
          kubectl port-forward svc/story-agent 8000:8000 >/tmp/pf.log 2>&1 &
          sleep 5
          python scripts/verify_step3.py exhaust

      - name: Evidence (Redis keys, published story)
        run: |
          kubectl get pods -o wide | tee verify_output_step3_kind_pods.txt
          keys=$(kubectl exec deploy/redis -- redis-cli --scan)
          printf '%s\n' "$keys" | tee verify_output_step3_kind_redis.txt | sed -n '1,20p'
          grep -Fq 'story-agent||dapr.internal.default.story-agent.workflow||' <<< "$keys" || {
            echo "Expected Dapr workflow state keys are missing from Redis"; exit 1;
          }
          published_name=$(python -c 'import json,re; d=json.load(open("verify_output_step3_run_approved.json", encoding="utf-8")); print(re.search(r"published/([^ ]+)", d["reply"]).group(1))')
          kubectl exec deploy/publisher -- cat "/data/published/$published_name" > verify_output_step3_kind_published.md
          python scripts/verify_published_story.py verify_output_step3_run_approved.json verify_output_step3_kind_published.md
          kubectl rollout restart deployment/publisher
          kubectl rollout status deployment/publisher --timeout=300s
          kubectl exec deploy/publisher -- test -s "/data/published/$published_name"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -l app=story-agent || true
          kubectl logs -l app=story-agent --all-containers --tail=200 || true
          kubectl logs -l app=publisher --tail=100 || true
          kubectl get pods -n dapr-system

      - name: Upload reports
        if: always()
        id: reports
        uses: actions/upload-artifact@v4
        with:
          name: step3-kind-reports
          path: |
            step3/verify_output_step3_*.txt
            step3/verify_output_step3_*.md
            step3/verify_output_step3_*.json
          if-no-files-found: warn

      - name: Write GitHub job summary
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          {
            echo "## Step 3 Kind verification"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Python: $(python --version)"
            echo "- Dapr CLI: $(dapr --version | head -n 1)"
            echo "- Dapr runtime target: \`${DAPR_RUNTIME_VERSION}\`"
            echo "- Dapr cluster status:"
            echo '```text'
            dapr status -k || true
            echo '```'
            if test -n "$REPORT_ARTIFACT_URL"; then
              echo "- Reports and published Markdown: [step3-kind-reports]($REPORT_ARTIFACT_URL)"
            else
              echo "- Reports and published Markdown: see the \`step3-kind-reports\` artifact, if uploaded."
            fi
            echo
            for report in verify_output_step3_kind_*.txt; do
              test -f "$report" || continue
              echo "### \`$report\`"
              grep -E '^\[(PASS|FAIL)\]|ALL CHECKS PASSED|CHECK(S)? FAILED' "$report" || true
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
