# FastAPI + deep agent + Dapr workflow runtime, with a Dapr sidecar injected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: story-agent }
  template:
    metadata:
      labels: { app: story-agent }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "story-agent"
        dapr.io/app-port: "8000"
    spec:
      containers:
        - name: story-agent
          image: story-agent:dev
          imagePullPolicy: Never          # image is loaded into Kind, not pulled
          envFrom:
            - secretRef: { name: story-agent-env }   # your .env (OPENAI_API_KEY, ...)
          env:
            - { name: MCP_URL, value: "http://publisher:8765/mcp" }
            - { name: WRITER_AGENT_URL, value: "http://127.0.0.1:8100/draft" }
            - { name: QUALITY_REVIEW_AGENT_URL, value: "http://127.0.0.1:8101/review" }
          ports: [{ containerPort: 8000 }]
        - name: story-writer-agent
          image: story-agent:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.writer_agent:app", "--host", "127.0.0.1", "--port", "8100"]
          envFrom:
            - secretRef: { name: story-agent-env }
          env:
            - { name: MCP_URL, value: "http://publisher:8765/mcp" }
          ports: [{ containerPort: 8100 }]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"
            periodSeconds: 5
        - name: quality-review-agent
          image: story-agent:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.quality_reviewer_agent:app", "--host", "127.0.0.1", "--port", "8101"]
          envFrom:
            - secretRef: { name: story-agent-env }
          ports: [{ containerPort: 8101 }]
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz', timeout=2)"
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: story-agent
spec:
  selector: { app: story-agent }
  ports: [{ port: 8000 }]
