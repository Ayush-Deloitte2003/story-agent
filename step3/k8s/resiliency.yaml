# Retry transient Pub/Sub delivery failures before Dapr forwards them to the
# subscription's story-events-dead topic.
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: story-pubsub
spec:
  policies:
    retries:
      pubsubRetry:
        policy: exponential
        maxInterval: 30s
        maxRetries: 5
  targets:
    components:
      pubsub:
        inbound:
          retry: pubsubRetry
