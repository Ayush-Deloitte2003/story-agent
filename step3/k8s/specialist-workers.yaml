# Each specialist has its own Dapr app ID, workflow runtime, and scalable Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: continuity-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: continuity-worker }
  template:
    metadata:
      labels: { app: continuity-worker }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "continuity-worker"
        dapr.io/app-port: "8001"
    spec:
      containers:
        - name: continuity-worker
          image: story-agent:dev
          imagePullPolicy: Never
          command: ["uvicorn", "app.continuity_worker:app", "--host", "0.0.0.0", "--port", "8001"]
          envFrom:
            - secretRef: { name: story-agent-env }
          ports: [{ containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: continuity-worker
spec:
  selector: { app: continuity-worker }
  ports: [{ port: 8001, targetPort: 8001 }]
---
